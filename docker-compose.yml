# docker-compose.yml
#
# Tres perfiles, un unico repositorio montado. La imagen trae las dependencias;
# el codigo va montado como volumen, asi se edita sin reconstruir nada.
#
#   sim   simulador con el escritorio en el navegador. Cualquier sistema
#         operativo, cualquier tarjeta grafica. Es el que usaran los alumnos.
#   real  robot fisico por Ethernet. SOLO LINUX: necesita network_mode host,
#         que en Docker Desktop de Windows y macOS no funciona de verdad.
#         No es una limitacion nuestra, es del transporte DDS.
#   dev   shell con la red del anfitrion y GUI por X11. Para trabajar en Linux.
#
# Uso:
#   docker compose --profile sim  up                  -> simulador + noVNC
#   docker compose --profile sim  run --rm shell      -> terminal
#   docker compose --profile real run --rm real       -> robot fisico
#
# Construir la imagen la primera vez:
#   docker compose build

services:

  # -------------------------------------------------------------------------
  # SIMULADOR (alumnos, cualquier SO)
  # -------------------------------------------------------------------------
  sim:
    profiles: ["sim"]
    build:
      context: ./docker
      dockerfile: Dockerfile
    # Imagen publicada: `docker compose pull` la baja sin construir nada.
    # Para construirla en local:  docker compose --profile sim build
    image: ghcr.io/isoto-mondragon/go2-workspace:latest
    container_name: go2-sim
    environment:
      GO2_MODE: sim
      GO2_GUI: ${GO2_GUI:-novnc}
      GO2_RES: ${GO2_RES:-1280x800x24}
      GO2_DOMAIN: 1
      GO2_IFACE: lo
    ports:
      - "6080:6080"     # noVNC: http://localhost:6080/vnc.html
      - "5900:5900"     # VNC nativo: bastante mas rapido que el navegador
    # Docker limita /dev/shm a 64 MB. MuJoCo y el servidor X lo agradecen, y
    # evita fallos de memoria compartida al renderizar.
    shm_size: "512m"
    volumes:
      - .:/workspace
    working_dir: /opt/go2/unitree_mujoco/simulate_python
    command: python3 unitree_mujoco.py
    stdin_open: true
    tty: true
    # El simulador y el control corren en el MISMO contenedor y hablan por
    # loopback. Dos contenedores distintos no se verian: "lo" no se comparte.

  # -------------------------------------------------------------------------
  # TERMINAL sobre el mismo entorno de simulacion
  # -------------------------------------------------------------------------
  # Se conecta a la red del contenedor `sim` para compartir su loopback, que es
  # por donde va el DDS de la simulacion.
  shell:
    profiles: ["sim"]
    image: ghcr.io/isoto-mondragon/go2-workspace:latest
    container_name: go2-shell
    depends_on: [sim]
    network_mode: "service:sim"
    environment:
      GO2_MODE: sim
      # `none` sin servidor X propio: este contenedor no dibuja nada y comparte
      # namespace con `sim`. Si arrancase su propio Xvfb en :99 impediria que
      # `sim` levante el suyo, y el visor dejaria de funcionar.
      GO2_GUI: none
      GO2_NO_XVFB: "1"
      # Sin esto, el HOME del usuario no declarado es /workspace y el
      # contenedor ensucia el repositorio con .bash_history y .cache/
      HOME: /tmp/go2home
      GO2_DOMAIN: 1
      GO2_IFACE: lo
    volumes:
      - .:/workspace
    working_dir: /workspace
    # Escribir con el usuario del anfitrion en lugar de root. Sin esto, todo lo
    # que el contenedor cree en el volumen (experimentos, figuras) pertenece a
    # root y no se puede borrar ni editar desde fuera sin sudo.
    # En Windows y macOS la variable no existe y se ignora sin consecuencias.
    user: "${UID_GID:-}"
    command: bash
    stdin_open: true
    tty: true

  # -------------------------------------------------------------------------
  # ROBOT FISICO (solo Linux)
  # -------------------------------------------------------------------------
  real:
    profiles: ["real"]
    image: ghcr.io/isoto-mondragon/go2-workspace:latest
    container_name: go2-real
    network_mode: host          # imprescindible para el DDS por Ethernet
    environment:
      GO2_MODE: real
      GO2_GUI: none
      GO2_DOMAIN: 0
      # Vacia por defecto. El entrypoint aborta con un mensaje claro y
      # lista las interfaces disponibles si se arranca en modo real sin
      # definirla. No se valida aqui porque compose interpola todos los
      # servicios aunque solo construyas uno.
      GO2_IFACE: ${GO2_IFACE:-}
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: bash
    stdin_open: true
    tty: true
    # Antes de arrancar esto, en el ANFITRION:
    #   ./env/go2_net.sh up      (IP estatica 192.168.123.222)
    # El contenedor usa la red del anfitrion, asi que la configuracion de red
    # se hace fuera.

  # -------------------------------------------------------------------------
  # DESARROLLO (Linux, GUI nativa)
  # -------------------------------------------------------------------------
  dev:
    profiles: ["dev"]
    image: ghcr.io/isoto-mondragon/go2-workspace:latest
    container_name: go2-dev
    network_mode: host
    environment:
      GO2_MODE: ${GO2_MODE:-sim}
      GO2_GUI: x11
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    working_dir: /workspace
    command: bash
    stdin_open: true
    tty: true
    # En el anfitrion, una vez por sesion:  xhost +local:docker
